---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

tasks:
  default:
    desc: Run KCL for app
    requires:
      vars: [APP]
    vars:
      F: '{{.F | default "base"}}'
    dir: "{{.ROOT_DIR}}/apps/{{.APP}}/{{.F}}"
    cmds:
      - kat

  render:
    desc: Render KCL for app
    requires:
      vars: [APP]
    vars:
      F: '{{.F | default "base"}}'
      O: '{{.O | default "out.yaml"}}'
    dir: "{{.ROOT_DIR}}/apps/{{.APP}}/{{.F}}"
    cmds:
      - cmd: mkdir -p "{{joinPath .ROOT_DIR .O | dir}}"
        silent: true
      - kat > "{{joinPath .ROOT_DIR .O}}"

  gen:
    desc: Generate KCL code
    cmds:
      - kcl chart update
      - |-
        kcl export konfig/models/backend/ -S BackendTenantPatch \
          --output=konfig/models/frontend/patch.schema.json

  lock:
    desc: Regenerate all kcl.mod.lock files
    cmds:
      - fd kcl.mod.lock apps/ --type f -x rm {}
      - fd '^kcl\.mod$' apps/ --type f --exact-depth 4 -x sh -c 'cd "$(dirname {})" && kcl mod metadata >/dev/null'

  chart:update:
    desc: Update KCL charts
    cmds:
      - kcl chart update

  bootstrap:
    desc: Render and apply the day-0 bootstrap for a live cluster (bootstrap/core/<CLUSTER_NAME>)
    summary: |
      The canonical day-0 apply: renders bootstrap/core/<CLUSTER_NAME> (Argo CD,
      Cilium, the CSR approver, the cluster Secret, and -- on the hub -- the
      tenants ApplicationSet) and server-side-applies it, retrying while the Argo
      CRDs in the bundle establish. tald and the live talos/argocd bootstrap all
      funnel through the same bootstrap-render + apply-retry, so a local cluster
      and a real one come up through one code path.

      The render reads DOPPLER_TOKEN and DOPPLER_ARGO_CD_TOKEN from the
      environment for the bootstrap doppler-credentials Secrets; supply them
      (e.g. `doppler run -- task kcl:bootstrap CLUSTER_NAME=mgmt`) for any cluster
      whose secret stores are real. On tald they are stubbed.
    requires:
      vars: [CLUSTER_NAME]
    vars:
      OUT: "{{.ROOT_DIR}}/.cache/render/bootstrap-{{.CLUSTER_NAME}}.yaml"
      ARGS: '{{.ARGS | default ""}}'
      # Passed through to apply-retry (which defaults it to plain `kubectl`). tald
      # sets its hermetic `kubectl --kubeconfig .cache/...` so the apply targets the
      # test cluster, letting tald reuse this one canonical day-0 task.
      KUBECTL_BIN: '{{.KUBECTL_BIN | default ""}}'
    cmds:
      - task: bootstrap-render
        vars: { CLUSTER_NAME: "{{.CLUSTER_NAME}}", OUT: "{{.OUT}}", ARGS: "{{.ARGS}}" }
      - task: apply-retry
        vars: { OUT: "{{.OUT}}", KUBECTL_BIN: "{{.KUBECTL_BIN}}" }

  bootstrap-render:
    desc: Render bootstrap/core/<CLUSTER_NAME> to OUT (no apply)
    # OUT must be an ABSOLUTE path: this task cd's into the package dir, so a
    # relative OUT would resolve under bootstrap/core/<CLUSTER_NAME>.
    requires:
      vars: [CLUSTER_NAME, OUT]
    vars:
      ARGS: '{{.ARGS | default ""}}'
    # cd into the package (the kclipper helm plugin resolves chart paths from the
    # package root) and capture stdout only -- kcl writes diagnostics to stderr,
    # so the manifest stream stays clean for apply. KCL_RUN_FLAGS matches the CMP.
    dir: "{{.ROOT_DIR}}/bootstrap/core/{{.CLUSTER_NAME}}"
    cmds:
      - cmd: mkdir -p "{{.OUT | dir}}"
        silent: true
      - kcl run {{.KCL_RUN_FLAGS}} {{.ARGS}} > "{{.OUT}}"
      - test -s "{{.OUT}}"

  apply-retry:
    internal: true
    requires:
      vars: [OUT]
    vars:
      # A distinct name (not KUBECTL) on purpose: go-task merges every included
      # taskfile's top-level vars into one global scope, so tald's hermetic
      # `KUBECTL` would otherwise leak in here and aim a LIVE apply at the .cache
      # kubeconfig. tald passes KUBECTL_BIN to override.
      KUBECTL_BIN: '{{.KUBECTL_BIN | default "kubectl"}}'
      TRIES: '{{.TRIES | default "8"}}'
      DELAY: '{{.DELAY | default "8"}}'
      # What is being applied, for the retry log line. The Cilium overlay reuses
      # this task too (it has the same CRD-then-CR shape), so the message is not
      # hardcoded to "bootstrap".
      LABEL: '{{.LABEL | default "bootstrap"}}'
    # A bundle that carries CRDs plus the CRs that use them (a bootstrap bundle's
    # AppProject/ApplicationSet, or the Cilium overlay's LB pool / L2 policy) makes
    # the first server-side apply create the CRDs and fail on those CRs; retry the
    # whole apply until the CRDs establish and it goes clean.
    cmds:
      - 'for i in $(seq 1 {{.TRIES}}); do {{.KUBECTL_BIN}} apply --server-side --force-conflicts -f "{{.OUT}}" && exit 0; echo "{{.LABEL}} apply attempt $i/{{.TRIES}} failed (CRDs may still be establishing); retrying in {{.DELAY}}s" >&2; sleep {{.DELAY}}; done; echo "{{.LABEL}} apply did not converge after {{.TRIES}} attempts" >&2; exit 1'
