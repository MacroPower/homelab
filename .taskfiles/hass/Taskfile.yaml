---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

# Home Assistant config rendered from KCL. haconfig/ is the library and
# home/hass/ is the module for the Pi. A render prints one {path, content} YAML stream,
# and scripts/split.py turns it into a config directory under the gitignored
# .cache/hass/. hass:deploy uploads that directory to the Pi over SSH, and
# hass:apply writes the registry state, such as floors and areas, through
# HA's API.
#
# Quickstart:
#   task hass:render   # render home/hass/ into .cache/hass/home/hass/config
#   task hass:check    # render, load with HA's YAML loader, run check_config
#   task hass:diff     # render and diff against the live config on the Pi
#   task hass:deploy   # check, diff, confirm, upload to the Pi, and reload HA
#   task hass:upgrade  # back up, then install the pinned HA Core release on the Pi
#   task hass:plan     # render and plan the registry state against live HA
#   task hass:apply    # plan, confirm, and apply the registry state
#   task hass:gate     # library tests, golden diff, and check of home/hass/

vars:
  # go-task merges every included taskfile's top-level vars into one global
  # scope, so each name here carries a HASS_ or HACONFIG_ prefix.
  HACONFIG_DIR: "{{.ROOT_DIR}}/haconfig"
  HASS_CACHE_DIR: "{{.ROOT_DIR}}/.cache/hass"
  HASS_SCRIPTS: "{{.TASKFILE_DIR}}/scripts"
  # The Home Assistant release that hass:check validates against and that
  # hass:gen reads the catalogs from. Pinned by exact tag. Renovate bumps it
  # through the regex manager in .github/renovate.json5, which matches the
  # comment on the next line.
  # renovate: datasource=docker depName=ghcr.io/home-assistant/home-assistant
  HASS_IMAGE: '{{.HASS_IMAGE | default "ghcr.io/home-assistant/home-assistant:2026.10.4"}}'
  # The SSH destination and config directory that hass:diff reads the live
  # config from and that hass:deploy writes to. hass:upgrade reads the deploy
  # lock there. The HAOS SSH apps mount the config at /homeassistant and link
  # /config to it.
  HASS_SSH: '{{.HASS_SSH | default "root@hass.cin.macro.network"}}'
  HASS_CONFIG_DIR: '{{.HASS_CONFIG_DIR | default "/config"}}'
  # The HA instance that the state tasks talk to. They read the access token
  # from HASS_TOKEN in the environment.
  HASS_URL: '{{.HASS_URL | default "https://hass.cin.macro.network"}}'
  HASTATE: 'uv run -q --project "{{.ROOT_DIR}}/haconfig/engine" hastate --url "{{.HASS_URL}}"'

tasks:
  render:
    desc: Render a config module into a config directory (default home/hass/ to .cache/hass/home/hass/config)
    summary: |
      Renders the module with kcl run, then splits the stream into OUT. The
      split swaps the finished directory into place, so a failed render keeps
      the previous output and a removed package also removes its file. It
      refuses an OUT that holds .git, and any other non-empty directory that
      an earlier render did not write. When the module sets
      HomeAssistant.state, the split writes the state document to state.json
      next to OUT, and otherwise removes that file.

      Args:
        MODULE: The config module, relative to the repo root (default: home/hass)
        OUT: The config directory, absolute or relative to the repo root
             (default: .cache/hass/<MODULE>/config)
        ARGS: Extra kcl run flags, such as -D revision=<sha>
    vars:
      MODULE: '{{.MODULE | default "home/hass"}}'
      OUT: '{{.OUT | default (printf ".cache/hass/%s/config" .MODULE)}}'
      ABS_OUT: '{{if isAbs .OUT}}{{.OUT}}{{else}}{{joinPath .ROOT_DIR .OUT}}{{end}}'
      ARGS: '{{.ARGS | default ""}}'
    # render-dir runs in DIR, and go-task creates a missing dir. Without this
    # check, a mistyped MODULE leaves an empty directory in the repo.
    # hass:load and hass:check reach this check through hass:render.
    preconditions:
      - sh: test -f "{{.ROOT_DIR}}/{{.MODULE}}/kcl.mod"
        msg: "no module at {{.MODULE}}"
    cmds:
      - task: render-dir
        vars:
          DIR: "{{.MODULE}}"
          STREAM: "{{.HASS_CACHE_DIR}}/{{.MODULE}}/stream.yaml"
          OUT: "{{.ABS_OUT}}"
          STATE: "{{.ABS_OUT | dir}}/state.json"
          ARGS: "{{.ARGS}}"

  test:
    desc: Run the haconfig unit tests and diff the hallway example against its golden output
    summary: |
      Runs kcl test over the library packages, renders
      haconfig/examples/hallway and diffs it against
      haconfig/examples/hallway/golden, then renders every
      haconfig/examples/neg-* module and expects it to fail with the text in
      its expected-error.txt.

      Args:
        UPDATE: Set to 1 to rewrite golden/ from the render instead of diffing
    vars:
      GOLDEN_OUT: '{{if .UPDATE}}{{.HACONFIG_DIR}}/examples/hallway/golden{{else}}{{.HASS_CACHE_DIR}}/golden{{end}}'
      GOLDEN_STATE: '{{if .UPDATE}}{{.HACONFIG_DIR}}/examples/hallway/golden.state.json{{else}}{{.HASS_CACHE_DIR}}/golden.state.json{{end}}'
      NEG_DIRS:
        sh: find haconfig/examples -mindepth 1 -maxdepth 1 -type d -name 'neg-*' 2>/dev/null | sort
    cmds:
      - task: unit
      - task: render-dir
        vars:
          DIR: haconfig/examples/hallway
          STREAM: "{{.HASS_CACHE_DIR}}/golden.stream.yaml"
          OUT: "{{.GOLDEN_OUT}}"
          STATE: "{{.GOLDEN_STATE}}"
      - cmd: diff -r "{{.HACONFIG_DIR}}/examples/hallway/golden" "{{.HASS_CACHE_DIR}}/golden"
        if: '{{not .UPDATE}}'
      - cmd: diff "{{.HACONFIG_DIR}}/examples/hallway/golden.state.json" "{{.HASS_CACHE_DIR}}/golden.state.json"
        if: '{{not .UPDATE}}'
      # Skipped when no neg-* module exists, because a for loop over an empty
      # split var still runs once with ITEM="".
      - for: { var: NEG_DIRS, split: "\n" }
        if: '{{ne .NEG_DIRS ""}}'
        task: expect-fail
        vars: { DIR: "{{.ITEM}}" }
      - task: engine-unit
      - cmd: echo "haconfig tests passed{{if .UPDATE}} (golden/ rewritten){{end}}"
        silent: true

  load:
    desc: Render a config module and load it with Home Assistant's YAML loader
    summary: |
      Renders the module, stages a copy with UI stubs and fake secrets in
      .cache/hass/<MODULE>/stage, and loads it with annotatedyaml. This check
      runs without Docker in about a second.

      Args:
        MODULE: The config module, relative to the repo root (default: home/hass)
    vars:
      MODULE: '{{.MODULE | default "home/hass"}}'
      OUT: "{{.HASS_CACHE_DIR}}/{{.MODULE}}/config"
      STAGE: "{{.HASS_CACHE_DIR}}/{{.MODULE}}/stage"
    cmds:
      - task: render
        vars: { MODULE: "{{.MODULE}}", OUT: "{{.OUT}}" }
      - python3 "{{.HASS_SCRIPTS}}/stage.py" "{{.OUT}}" "{{.STAGE}}"
      - uv run -q "{{.HASS_SCRIPTS}}/haload.py" "{{.STAGE}}"

  check:
    desc: Render, load, and validate a config module with check_config in Docker
    summary: |
      Runs hass:load, then Home Assistant's check_config from HASS_IMAGE
      against the stage. The check fails on a non-zero exit, on any error or
      warning in the JSON report, and on any ERROR: or CRITICAL: log line,
      because check_config reports invalid automations only in its log.

      Args:
        MODULE: The config module, relative to the repo root (default: home/hass)
        HASS_IMAGE: The Home Assistant image (default: the pinned tag)
    vars:
      MODULE: '{{.MODULE | default "home/hass"}}'
      STAGE: "{{.HASS_CACHE_DIR}}/{{.MODULE}}/stage"
    cmds:
      - task: load
        vars: { MODULE: "{{.MODULE}}" }
      - >-
        python3 "{{.HASS_SCRIPTS}}/checkconfig.py"
        --catalog "{{.HACONFIG_DIR}}/models/frontend/trigger/catalog.k"
        "{{.HASS_IMAGE}}" "{{.STAGE}}"

  diff:
    desc: Render a config module and diff it against the live config on the Pi
    summary: |
      Renders the module, reads the live copy of every file and directory the
      render writes, including the package directory, and prints a git diff
      from live/ to rendered/. A file that only the live config holds under
      packages/ shows as deleted, because HA loads every file there until
      hass:deploy removes it. The task then warns about each referenced secret
      that no live secrets.yaml defines. It never copies a secrets.yaml or a
      symlink, and it never writes to the Pi.

      Over SSH, the Pi checks the secret names itself and returns only the
      missing ones. The Pi needs an SSH app with your key and a network port,
      as docs/hass.md describes.

      Args:
        MODULE: The config module, relative to the repo root (default: home/hass)
        HASS_SSH: The SSH destination (default: root@hass.cin.macro.network)
        HASS_CONFIG_DIR: The config directory on the Pi (default: /config)
        LIVE: Read the live config from this local directory instead of SSH,
              such as a mount of the Pi's Samba config share
        SEMANTIC: Set to 1 to diff parsed YAML with sorted keys and no
                  comments, so formatting and comment changes drop out
    vars:
      MODULE: '{{.MODULE | default "home/hass"}}'
      OUT: "{{.HASS_CACHE_DIR}}/{{.MODULE}}/config"
      WORK: "{{.HASS_CACHE_DIR}}/{{.MODULE}}/diff"
      LIVE: '{{.LIVE | default ""}}'
      SOURCE: >-
        {{if .LIVE}}--live-dir "{{if isAbs .LIVE}}{{.LIVE}}{{else}}{{joinPath .USER_WORKING_DIR .LIVE}}{{end}}"{{else}}--ssh "{{.HASS_SSH}}" --remote-dir "{{.HASS_CONFIG_DIR}}"{{end}}
    cmds:
      - task: render
        vars: { MODULE: "{{.MODULE}}", OUT: "{{.OUT}}" }
      - >-
        uv run -q "{{.HASS_SCRIPTS}}/livediff.py" {{if .SEMANTIC}}--semantic{{end}}
        "{{.OUT}}" "{{.WORK}}" {{.SOURCE}}

  deploy:
    desc: Render, check, and upload a config module to the Pi over SSH, then reload Home Assistant
    summary: |
      Runs hass:check, then diffs the render against the Pi as hass:diff does
      and asks you to type yes. It uploads the files the render writes and
      the package directory in one SSH session, and never touches another
      path, such as secrets.yaml or the UI files. The Pi first checks that
      its files still match the diff, and saves them to a backup tar under
      .hass-deploy/backups/. HA then checks the config through its API, and
      an invalid config restores the backup. Last, homeassistant.reload_all
      loads the new config, or HA restarts with RESTART=1, and the task
      checks that the Pi's files match the render.

      The task stops before the upload when nothing changed, and when the
      Pi's secrets.yaml lacks a referenced secret. It warns when a changed
      domain needs a restart that a reload does not cover.

      Args:
        MODULE: The config module, relative to the repo root (default: home/hass)
        HASS_SSH: The SSH destination (default: root@hass.cin.macro.network)
        HASS_CONFIG_DIR: The config directory on the Pi (default: /config)
        HASS_URL: The HA base URL (default: https://hass.cin.macro.network)
        YES: Set to 1 to deploy without asking. Any other value asks
        RESTART: Set to 1 to restart HA instead of reloading the YAML
        DRY_RUN: Set to any value to stop after the diff and the reload plan
      Env:
        HASS_TOKEN: An admin long-lived access token
    interactive: true
    vars:
      MODULE: '{{.MODULE | default "home/hass"}}'
      OUT: "{{.HASS_CACHE_DIR}}/{{.MODULE}}/config"
      WORK: "{{.HASS_CACHE_DIR}}/{{.MODULE}}/deploy"
      YES: '{{.YES | default ""}}'
      RESTART: '{{.RESTART | default ""}}'
      DRY_RUN: '{{.DRY_RUN | default ""}}'
    preconditions: &token
      - sh: test -n "$HASS_TOKEN"
        msg: "set HASS_TOKEN to an admin long-lived access token, for example with doppler run -p <project> -c <config> -- task ..."
    cmds:
      - task: check
        vars: { MODULE: "{{.MODULE}}" }
      - >-
        uv run -q "{{.HASS_SCRIPTS}}/deploy.py" "{{.OUT}}" "{{.WORK}}"
        --ssh "{{.HASS_SSH}}" --remote-dir "{{.HASS_CONFIG_DIR}}" --url "{{.HASS_URL}}"
        {{if eq .YES "1"}}--yes{{end}} {{if eq .RESTART "1"}}--restart{{end}} {{if .DRY_RUN}}--dry-run{{end}}

  upgrade:
    desc: Install a Home Assistant Core or OS release on the Pi, with a backup first
    summary: |
      Calls update.install on HA's update entity, which saves a backup and
      hands the install to the Supervisor, then waits until the Pi runs the
      release. Core installs the HASS_IMAGE tag that hass:check validates
      against, and refuses a tag older than the running release. The OS
      installs the latest release that the Supervisor offers. The task asks
      you to type yes first.

      A Core install restarts HA. When the release fails to start, the
      Supervisor rolls back to the old one, and the task fails. An OS install
      writes the release to the spare boot slot, then the task reboots the
      Pi and checks that it booted the release. Before the install, the task
      checks that HA's config check passes on the Pi and that no deploy holds
      the lock. After a Core install, it runs hass:plan and hass:diff to show
      what the release changed.

      Args:
        COMPONENT: core or os (default: core)
        VERSION: The release to install instead, such as an older one to roll back to
        BACKUP: Set to 0 to skip the backup. Any other value backs up
        REBOOT: Set to 0 to leave an OS release pending until you reboot. Any other value reboots
        YES: Set to 1 to upgrade without asking. Any other value asks
        DRY_RUN: Set to any value to stop after the plan
        TIMEOUT: The seconds that the install, the restart, and the reboot get (default: 7200)
        HASS_URL: The HA base URL (default: https://hass.cin.macro.network)
        HASS_SSH: The SSH destination for the lock check (default: root@hass.cin.macro.network)
      Env:
        HASS_TOKEN: An admin long-lived access token
    interactive: true
    vars:
      COMPONENT: '{{.COMPONENT | default "core"}}'
      VERSION: '{{.VERSION | default ""}}'
      BACKUP: '{{.BACKUP | default ""}}'
      REBOOT: '{{.REBOOT | default ""}}'
      YES: '{{.YES | default ""}}'
      DRY_RUN: '{{.DRY_RUN | default ""}}'
      TIMEOUT: '{{.TIMEOUT | default "7200"}}'
    preconditions: *token
    cmds:
      - >-
        uv run -q "{{.HASS_SCRIPTS}}/upgrade.py" "{{.COMPONENT}}"
        --url "{{.HASS_URL}}" --ssh "{{.HASS_SSH}}" --remote-dir "{{.HASS_CONFIG_DIR}}"
        --pin "{{splitList ":" .HASS_IMAGE | last}}" {{if .VERSION}}--version "{{.VERSION}}"{{end}}
        --timeout "{{.TIMEOUT}}" {{if eq .BACKUP "0"}}--no-backup{{end}} {{if eq .REBOOT "0"}}--no-reboot{{end}}
        {{if eq .YES "1"}}--yes{{end}} {{if .DRY_RUN}}--dry-run{{end}}
      - task: plan
        if: '{{and (eq .COMPONENT "core") (not .DRY_RUN)}}'
      - task: diff
        if: '{{and (eq .COMPONENT "core") (not .DRY_RUN)}}'

  plan:
    desc: Render a config module and plan its registry state against live Home Assistant
    summary: |
      Renders the module, then compares the state.json that the render wrote
      with the live registries and prints each create, update, and delete.
      It also lists the live objects that a managed collection lacks. The
      task only reads from HA. It fails when the plan has problems, such as
      an area on a floor that does not exist, and when it cannot read HA.

      Args:
        MODULE: The config module, relative to the repo root (default: home/hass)
        HASS_URL: The HA base URL (default: https://hass.cin.macro.network)
      Env:
        HASS_TOKEN: An admin long-lived access token
    vars:
      MODULE: '{{.MODULE | default "home/hass"}}'
      OUT: "{{.HASS_CACHE_DIR}}/{{.MODULE}}/config"
    preconditions: *token
    cmds:
      - task: render
        vars: { MODULE: "{{.MODULE}}", OUT: "{{.OUT}}" }
      - '{{.HASTATE}} plan --state "{{.HASS_CACHE_DIR}}/{{.MODULE}}/state.json"'

  apply:
    desc: Render a config module, plan its registry state, confirm, and apply it to live Home Assistant
    summary: |
      Runs the same plan as hass:plan and asks you to type yes. It then
      applies each change in dependency order, stops at the first failure,
      and plans again to check that no changes remain. An HTTP change runs
      last: HA restarts on the new config, and the apply reconnects and
      confirms it.

      Args:
        MODULE: The config module, relative to the repo root (default: home/hass)
        HASS_URL: The HA base URL (default: https://hass.cin.macro.network)
        YES: Set to 1 to apply without asking. Any other value asks
        RESTART: Set to 1 to restart HA after HACS changes integration code
      Env:
        HASS_TOKEN: An admin long-lived access token
    interactive: true
    vars:
      MODULE: '{{.MODULE | default "home/hass"}}'
      OUT: "{{.HASS_CACHE_DIR}}/{{.MODULE}}/config"
      YES: '{{.YES | default ""}}'
      RESTART: '{{.RESTART | default ""}}'
    preconditions: *token
    cmds:
      - task: render
        vars: { MODULE: "{{.MODULE}}", OUT: "{{.OUT}}" }
      - '{{.HASTATE}} apply --state "{{.HASS_CACHE_DIR}}/{{.MODULE}}/state.json" {{if eq .YES "1"}}--yes{{end}} {{if eq .RESTART "1"}}--restart{{end}}'

  import:
    desc: Write a KCL state file from the live Home Assistant instance
    summary: |
      Reads the registries, the devices and entities that carry your
      settings, the integrations, the apps, HACS, and the HTTP config from HA,
      and writes them as a State to OUT, so git starts from the live state.
      It leaves out every app option that holds a secret. A plan of the
      written state against the same instance shows no changes. The task
      refuses an existing OUT unless FORCE=1.

      Args:
        OUT: The KCL file, relative to the repo root (default: home/hass/state.k)
        VARIABLE: The variable that holds the State (default: hass_state)
        HASS_URL: The HA base URL (default: https://hass.cin.macro.network)
        FORCE: Set to 1 to overwrite OUT. Any other value refuses
      Env:
        HASS_TOKEN: An admin long-lived access token
    vars:
      OUT: '{{.OUT | default "home/hass/state.k"}}'
      VARIABLE: '{{.VARIABLE | default "hass_state"}}'
      FORCE: '{{.FORCE | default ""}}'
    preconditions: *token
    cmds:
      - >-
        {{.HASTATE}} import --out "{{if isAbs .OUT}}{{.OUT}}{{else}}{{joinPath .ROOT_DIR .OUT}}{{end}}"
        --variable "{{.VARIABLE}}" {{if eq .FORCE "1"}}--force{{end}}

  e2e:
    desc: Run the state engine's end-to-end tests against a fresh Home Assistant container
    summary: |
      Starts HASS_IMAGE in Docker, onboards a user, and runs plan, apply, and
      import against it. The tests reach the container through docker exec,
      so they need no published port. They take about three minutes.

      Args:
        HASS_IMAGE: The Home Assistant image (default: the pinned tag)
    dir: "{{.ROOT_DIR}}/haconfig/engine"
    env:
      HASS_IMAGE: "{{.HASS_IMAGE}}"
    cmds:
      - uv run -q pytest -q -m e2e

  gate:
    desc: Run hass:test, check_config on the hallway example, then hass:check for home/hass/
    cmds:
      - task: test
      - task: check-example
      - task: check
        vars: { MODULE: home/hass }
      - cmd: echo "hass gate passed"
        silent: true

  gen:
    desc: Regenerate the purpose trigger and condition catalogs from home-assistant/core
    summary: |
      Sparse-clones home-assistant/core at HASS_REF into .cache/hass/ and runs
      gencatalog.py, which rewrites trigger/catalog.k and condition/catalog.k
      under haconfig/models/frontend. Run it after a Renovate bump of
      HASS_IMAGE, because Renovate cannot run the generator itself.

      Args:
        HASS_REF: The home-assistant/core tag (default: the HASS_IMAGE tag)
    vars:
      HASS_REF: '{{.HASS_REF | default (splitList ":" .HASS_IMAGE | last)}}'
      CORE_DIR: "{{.HASS_CACHE_DIR}}/core-{{.HASS_REF}}"
    cmds:
      - task: clone-core
        vars: { HASS_REF: "{{.HASS_REF}}", CORE_DIR: "{{.CORE_DIR}}" }
      - uv run -q "{{.HASS_SCRIPTS}}/gencatalog.py" "{{.CORE_DIR}}" "{{.HASS_REF}}" "{{.HACONFIG_DIR}}/models/frontend"

  lock:
    desc: Regenerate the kcl.mod.lock files under haconfig/ and home/hass/
    # haconfig/, every module under haconfig/examples/, and home/hass/. fd skips
    # gitignored paths, so .cache/ never matches.
    cmds:
      - fd kcl.mod.lock haconfig home/hass --type f -x rm {}
      - fd '^kcl\.mod$' haconfig home/hass --type f -x sh -c 'cd "$(dirname {})" && kcl mod metadata >/dev/null'

  engine-unit:
    internal: true
    dir: "{{.ROOT_DIR}}/haconfig/engine"
    cmds:
      - uv run -q pytest -q

  unit:
    internal: true
    # Library packages only. examples/ holds standalone modules whose render
    # hass:test covers, so it stays out of kcl test.
    dir: "{{.ROOT_DIR}}/haconfig"
    cmds:
      - kcl test ./strings/... ./tags/... ./models/...

  render-dir:
    internal: true
    requires:
      vars: [DIR, STREAM, OUT, STATE]
    vars:
      ARGS: '{{.ARGS | default ""}}'
    # DIR is relative to the repo root. Task joins an included task's dir onto
    # the root unless the template starts with ROOT_DIR, so an absolute DIR
    # doubles. cd into the package so kcl resolves its kcl.mod and [profile]
    # entries, and capture stdout only. kcl writes diagnostics to stderr, so the stream stays
    # clean. KCL_RUN_FLAGS matches the in-cluster CMP render.
    dir: "{{.ROOT_DIR}}/{{.DIR}}"
    cmds:
      - cmd: mkdir -p "{{.STREAM | dir}}"
        silent: true
      - kcl run {{.KCL_RUN_FLAGS}} {{.ARGS}} > "{{.STREAM}}"
      - test -s "{{.STREAM}}"
      - uv run -q "{{.HASS_SCRIPTS}}/split.py" "{{.STREAM}}" "{{.OUT}}" "{{.STATE}}"

  check-example:
    internal: true
    # Loads and validates the hallway example that hass:test rendered into
    # .cache/hass/golden. home/hass/ might hold no packages, so
    # the example gives the gate check_config coverage of every kind of entry
    # the library emits.
    vars:
      OUT: "{{.HASS_CACHE_DIR}}/golden"
      STAGE: "{{.HASS_CACHE_DIR}}/golden-stage"
    cmds:
      - python3 "{{.HASS_SCRIPTS}}/stage.py" "{{.OUT}}" "{{.STAGE}}"
      - uv run -q "{{.HASS_SCRIPTS}}/haload.py" "{{.STAGE}}"
      - >-
        python3 "{{.HASS_SCRIPTS}}/checkconfig.py"
        --catalog "{{.HACONFIG_DIR}}/models/frontend/trigger/catalog.k"
        "{{.HASS_IMAGE}}" "{{.STAGE}}"

  expect-fail:
    internal: true
    requires:
      vars: [DIR]
    silent: true
    # A negative example renders with an error that holds the text of its
    # expected-error.txt, minus trailing newlines. A render that succeeds, or
    # that fails with other text, fails the test. DIR is relative to the repo
    # root, as in render-dir.
    dir: "{{.ROOT_DIR}}/{{.DIR}}"
    cmds:
      - |
        want=$(cat expected-error.txt)
        [ -n "$want" ] || { echo "{{.DIR}}: expected-error.txt is empty" >&2; exit 1; }
        if got=$(kcl run {{.KCL_RUN_FLAGS}} 2>&1); then
          echo "{{.DIR}}: render succeeded, expected an error with: $want" >&2; exit 1
        fi
        case "$got" in
          *"$want"*) echo "  {{base .DIR}}: failed as expected" ;;
          *) printf '%s: render failed with other text\nwant: %s\ngot:\n%s\n' "{{.DIR}}" "$want" "$got" >&2; exit 1 ;;
        esac

  clone-core:
    internal: true
    requires:
      vars: [HASS_REF, CORE_DIR]
    # A shallow, blobless, sparse clone that holds only the files gencatalog.py
    # reads. The status check skips the clone when CORE_DIR already exists, so
    # each tag clones once.
    status:
      - test -d "{{.CORE_DIR}}/.git"
    cmds:
      - rm -rf "{{.CORE_DIR}}.tmp"
      - >-
        git clone --quiet --depth 1 --branch "{{.HASS_REF}}" --filter=blob:none --no-checkout
        https://github.com/home-assistant/core.git "{{.CORE_DIR}}.tmp"
      - >-
        git -C "{{.CORE_DIR}}.tmp" sparse-checkout set --no-cone
        '/homeassistant/components/*/triggers.yaml' '/homeassistant/components/*/conditions.yaml'
      - git -C "{{.CORE_DIR}}.tmp" checkout --quiet
      - mv "{{.CORE_DIR}}.tmp" "{{.CORE_DIR}}"
