# yaml-language-server: $schema=../../../../charts/external_secrets/values.schema.json

# Single node: one replica each, no leader election.
replicaCount: 1
leaderElect: false

# Serialize reconciles to one worker. The offline `fake` provider this cluster
# forces on (fake_secret_stores=true) registers a single shared Provider whose
# NewClient writes an unsynchronized map (providers/v1/fake/fake.go); with the
# base's concurrent: 4, parallel ExternalSecret reconciles race that map and the
# controller dies on "fatal error: concurrent map writes". A single node has no
# need for 4-way concurrency, and serializing removes the race.
concurrent: 1

webhook:
  replicaCount: 1

certController:
  replicaCount: 1
