# yaml-language-server: $schema=../../../../charts/seaweedfs/values.schema.json

global:
  seaweedfs:
    createClusterRole: false
    serviceAccountName: securecodebox-seaweedfs

master:
  replicas: 1
  data:
    type: persistentVolumeClaim
    storageClass: openebs-hostpath
    size: 10Gi
  logs: &logs
    type: emptyDir
  nodeSelector: &nodeSelector |
    kubernetes.io/hostname: knas01
  tolerations: &tolerations |
    - key: "node-role.kubernetes.io/storage"
      effect: "NoSchedule"
  affinity: &affinity ""

filer:
  replicas: 1
  data:
    type: persistentVolumeClaim
    storageClass: openebs-hostpath
    size: 10Gi
  logs: *logs
  s3:
    enabled: true
    enableAuth: true
    createBuckets:
      - name: securecodebox
  nodeSelector: *nodeSelector
  tolerations: *tolerations
  affinity: *affinity

volume:
  replicas: 1
  dataDirs:
    - name: data1
      type: persistentVolumeClaim
      storageClass: openebs-hostpath
      size: 50Gi
      maxVolumes: 128
  idx:
    type: persistentVolumeClaim
    storageClass: openebs-hostpath
    size: 10Gi
  logs: *logs
  nodeSelector: *nodeSelector
  tolerations: *tolerations
  affinity: *affinity
