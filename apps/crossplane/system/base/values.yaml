# yaml-language-server: $schema=../../../../charts/crossplane/values.schema.json

replicas: 2

rbacManager:
  replicas: 2

customAnnotations:
  reloader.stakater.com/auto: "true"

metrics:
  enabled: true

resourcesCrossplane:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1024Mi

resourcesRBACManager:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
