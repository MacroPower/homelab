# yaml-language-server: $schema=../../../../charts/tempo/values.schema.json

# Docker-safe overrides: collapse every HA component to a single replica with
# maxUnavailable 1 (one tald node cannot spread the distributed Tempo ring).
# Persistence already uses openebs-hostpath in base; sizes shrunk to 5Gi.

distributor:
  replicas: 1
  maxUnavailable: 1

ingester:
  replicas: 1
  persistence:
    enabled: true
    storageClass: openebs-hostpath
    size: "5Gi"

querier:
  replicas: 1
  maxUnavailable: 1

queryFrontend:
  replicas: 1
  maxUnavailable: 1

gateway:
  enabled: true
  replicas: 1
  maxUnavailable: 1

metricsGenerator:
  enabled: true
  replicas: 1
  maxUnavailable: 1
  persistence:
    enabled: true
    storageClass: openebs-hostpath
    size: "5Gi"
