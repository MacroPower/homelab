# yaml-language-server: $schema=../../../../charts/seaweedfs/values.schema.json

global:
  seaweedfs:
    createClusterRole: false
    serviceAccountName: o11y-seaweedfs

master:
  logs: &logs
    type: emptyDir
  replicas: 1
  data:
    type: persistentVolumeClaim
    storageClass: openebs-hostpath
    size: 10Gi

filer:
  logs: *logs
  replicas: 1
  data:
    type: persistentVolumeClaim
    storageClass: openebs-hostpath
    size: 50Gi
  s3:
    enabled: true
    enableAuth: true
    createBuckets:
      - name: mimir-blocks
      - name: mimir-alertmanager
      - name: mimir-ruler
      - name: loki-chunks
      - name: loki-ruler
      - name: tempo-traces

volume:
  logs: *logs
  replicas: 1
  dataDirs:
    - name: data1
      type: persistentVolumeClaim
      storageClass: openebs-hostpath
      size: 500Gi
      maxVolumes: 128
    - name: data2
      type: persistentVolumeClaim
      storageClass: openebs-hostpath
      size: 500Gi
      maxVolumes: 128
    - name: data3
      type: persistentVolumeClaim
      storageClass: openebs-hostpath
      size: 500Gi
      maxVolumes: 128
  idx:
    type: persistentVolumeClaim
    storageClass: openebs-hostpath
    size: 50Gi
