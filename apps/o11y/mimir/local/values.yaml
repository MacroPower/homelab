# yaml-language-server: $schema=../../../../charts/mimir/values.schema.json

# Docker-safe overrides for single-node Talos-in-Docker. Everything else is
# inherited from base via json_merge_patch.
#
# - All HA components collapse to a single replica (one node can't spread them).
# - ingester / store_gateway: drop the required zone anti-affinity and disable
#   zone-aware replication so pods aren't stranded waiting for distinct zones.
# - Shrink PVCs to fit hostpath; keep the openebs-hostpath storage class.
# - S3 (endpoint and credential placeholders) is inherited from base; the local
#   o11y/seaweedfs overlay serves that endpoint with the literal dummy/dummy
#   credentials the s3-config ExternalSecret resolves offline, so block storage
#   works when it is enabled.

mimir:
  structuredConfig:
    # The default replication_factor (3) can never reach write quorum on the
    # single local ingester: remote_write 500s ("at least 2 live replicas
    # required") and series queries fail on the ring; pin it to 1.
    ingester:
      ring:
        replication_factor: 1

alertmanager:
  replicas: 1

distributor:
  replicas: 1

query_scheduler:
  replicas: 1

compactor:
  persistentVolume:
    size: 5Gi

ingester:
  replicas: 1
  persistentVolume:
    size: 10Gi
  topologySpreadConstraints: {}
  affinity: null
  zoneAwareReplication:
    enabled: false

store_gateway:
  replicas: 1
  persistentVolume:
    size: 5Gi
  topologySpreadConstraints: {}
  affinity: null
  zoneAwareReplication:
    enabled: false

admin-cache:
  replicas: 1

chunks-cache:
  replicas: 1

index-cache:
  replicas: 1

metadata-cache:
  replicas: 1

results-cache:
  replicas: 1
