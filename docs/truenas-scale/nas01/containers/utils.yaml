# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
#
# `shell` is a long-lived utility container with its own macvlan IP, reachable
# directly from the LAN over SSH:
#
#     ssh root@10.10.12.2     # or root@fc42:0:0:a::1202
#
# The image (oci.jacobcolvin.com/shell, built from the dotfiles repo) is
# SSH-ready out of the box: the sshd privsep user, the unlocked root shadow
# stub, root's passwd entry pointing at /home/dev, and the fish login wrapper
# are all baked in at build time. Runtime-only concerns are env-driven:
#   - container-init   persistence-volume symlinks and GOMI_TRASH_MOUNTS
#                      (IDMAPPED_MOUNTS unused here, see below), then execs
#                      its arguments.
#   - sshd-entrypoint  host keys, authorized_keys (SSH_GITHUB_KEYS_USER with
#                      retry + cache fallback), then execs sshd -D.
# So the whole deployment is environment variables plus the command below.

services:
  shell:
    image: oci.jacobcolvin.com/shell:latest
    container_name: shell
    hostname: shell
    restart: always

    command: ["container-init", "sshd-entrypoint"]

    environment:
      # GitHub user whose published keys (https://github.com/<user>.keys)
      # become root's authorized_keys. Fetched on every start with retry and
      # cached in the shell_ssh_keys volume for offline fallback. To rotate:
      # edit the GitHub side and `docker compose restart shell`.
      SSH_GITHUB_KEYS_USER: MacroPower

      # NOTE: IDMAPPED_MOUNTS is intentionally unset. OpenZFS does not honor
      # idmapped mounts on a dataset carrying POSIX ACLs (staging has a
      # default ACL): the bind mount succeeds but ZFS presents every inode
      # as the overflow uid (nobody), which then makes the kernel refuse
      # access -- including root's CAP_DAC_OVERRIDE. The idmap was the only
      # thing blocking writes. Without it, this privileged container runs as
      # real host root and writes to staging freely; the dataset's setgid
      # bit + POSIX default ACL make new files inherit group nasuser(3000)
      # with group rwx, so the photo app (a nasuser member) can use them.
      # Files land owned root:nasuser rather than shared:nasuser, which the
      # group-based 0770 layout is built to handle.

      # One absolute mountpoint per line. container-init pre-creates
      # $path/.Trash-$uid/{files,info} (mode 0700) so gomi has a usable
      # external trash on each writable bind mount. Listed paths must be
      # bind-mount roots in the container's mount namespace.
      GOMI_TRASH_MOUNTS: |
        /mnt/main/shared/photos/staging
        /mnt/main/archive/disks/staging

    cap_add:
      - SYS_ADMIN
      - SYS_PTRACE
      - SYS_RESOURCE
      - SYSLOG
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    devices:
      - /dev/fuse:/dev/fuse

    # /run is conventionally tmpfs (sshd writes its pid file there). /var/log
    # holds sshd's lastlog, which is per-session state we don't care to
    # persist. tmpfs for both keeps stale state from leaking into the
    # container layer across restarts.
    tmpfs:
      - /tmp
      - /run
      - /var/log

    volumes:
      # Persistent shell history and Claude state across recreates.
      - shell_commandhistory:/commandhistory
      - shell_claude_state:/claude-state
      # SSH host keys + cached authorized_keys (stable fingerprint across
      # --force-recreate).
      - shell_ssh_keys:/etc/ssh/keys
      # Photo library: parent is read-only, the staging subdir is writable
      # (the more-specific child mount overrides the parent at that path).
      - /mnt/main/shared/photos:/mnt/main/shared/photos:ro
      - /mnt/main/shared/photos/staging:/mnt/main/shared/photos/staging
      # Archive dataset, read-only.
      - /mnt/main/archive:/mnt/main/archive:ro
      - /mnt/main/archive/disks/staging:/mnt/main/archive/disks/staging
      # Optional env file sourced by the fish login wrapper. Edit on the host;
      # new ssh sessions pick up changes (no container restart needed).
      # Pre-create the file -- a missing host path becomes an empty
      # *directory*, which would break the read.
      - /mnt/main/containers/shell/env:/etc/ssh/env:ro

    networks:
      shared_macvlan:
        ipv4_address: "10.10.12.2"
        ipv6_address: "fc42:0:0:a::1202"
        mac_address: "e2:a8:1a:c6:45:74"
    dns:
      - "10.10.0.1"
      - "fc42:0:0:a::"
    cpu_percent: 80
    mem_limit: 32g

volumes:
  shell_commandhistory: {}
  shell_claude_state: {}
  shell_ssh_keys: {}

networks:
  shared_macvlan:
    external: true
    name: shared_macvlan
