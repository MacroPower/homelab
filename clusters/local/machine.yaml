# Container/single-node machine deltas for the local Talos-in-Docker node, merged
# on top of ../base/machine.common.yaml. The bare-metal machine.metal.yaml is not
# included, so this restates the container-compatible pieces the node still needs.
machine:
  kubelet:
    nodeIP:
      # The node's only address is 10.5.0.2 on the docker bridge; scope the
      # kubelet nodeIP to it (IPv4-only, like apps/cilium/system/local).
      validSubnets:
        - 10.0.0.0/8
    # Expose the persistent KCL/chart cache to pods so the repo-server's kclipper
    # sidecar can hostPath it across rebuilds: tald:kcl-cache-up mounts a named
    # Docker volume into the node at /var/kcl-cache, and this rbind/rshared mount
    # (the same shape base uses for the openebs hostpath dir) makes it visible in
    # the kubelet's mount namespace. talhelper APPENDS this to the base
    # machine.common.yaml extraMounts (the openebs bind), so only the new mount
    # belongs here -- restating openebs would duplicate it.
    extraMounts:
      - source: /var/kcl-cache
        destination: /var/kcl-cache
        type: bind
        options:
          - rbind
          - rshared
          - rw
  features:
    hostDNS:
      resolveMemberNames: true
      # Talos requires this true in container mode (it rejects false and the node
      # boot-loops). The real clusters set it false in base/machine.metal.yaml.
      forwardKubeDNSToHost: true
    # KubePrism backs the Cilium k8sServiceHost (localhost:7445); on the real
    # clusters it comes from clusters/main/machine.yaml.
    kubePrism:
      enabled: true
      port: 7445
  # Route image pulls through the host's persistent pull-through caches
  # (`task tald:cache-up` runs one stock `registry:2` per registry, each on a
  # named Docker volume that outlives `tald:down`), so a rebuild reuses cached
  # layers instead of re-pulling from the internet. The endpoints are the Docker
  # bridge gateway (the host) on the per-registry ports cache-up publishes; this
  # assumes the default 10.5.0.0/24 SUBNET, whose gateway Docker assigns .1. Ports
  # MUST stay in lockstep with cache-up's table. skipFallback is left at its
  # default (false), so a stopped or empty cache transparently falls back to the
  # upstream registry -- the cache is a pure optimization, never a hard dependency
  # that could wedge a bring-up. Local-only: the real clusters pull directly.
  registries:
    mirrors:
      docker.io:
        endpoints:
          - http://10.5.0.1:5000
      ghcr.io:
        endpoints:
          - http://10.5.0.1:5001
      quay.io:
        endpoints:
          - http://10.5.0.1:5002
      registry.k8s.io:
        endpoints:
          - http://10.5.0.1:5003
      gcr.io:
        endpoints:
          - http://10.5.0.1:5004
