clusterName: mgmt
talosVersion: v1.11.1
kubernetesVersion: v1.34.1
endpoint: https://kmgmt.cin.macro.network:6443
cniConfig:
  name: none

additionalMachineCertSans:
  - kmgmt.cin.macro.network
  - 127.0.0.1
additionalApiServerCertSans:
  - 127.0.0.1

clusterSvcNets:
  - 10.110.0.0/16
  - fc42:0:0:6e::/108
clusterPodNets:
  - 10.111.0.0/16
  - fc42:0:0:6f::/64

nodes:
  - hostname: kmgmt01.cin.macro.network
    ipAddress: 10.10.8.1
    controlPlane: true
    installDisk: &rpiMmcDevice /dev/mmcblk0
    nodeLabels:
      feature.node.kubernetes.io/network.max-link-speed: 1g
      topology.kubernetes.io/region: rack01
      topology.kubernetes.io/zone: az01
    networkInterfaces:
      - deviceSelector: &rpiNetDevice
          driver: bcmgenet
          hardwareAddr: "e4:5f:01:*"
        dhcp: false
        addresses:
          - "10.10.8.1/16"
          - "fc42:0:0:a::0801/64"
        mtu: &mtu 1500
        routes: &routes
          - network: 0.0.0.0/0
            gateway: "10.10.0.1"
          # Link-local IPv6 route set via RA with `metric: 1024`.
          - network: ::/0
            gateway: "fc42:0:0:a::"
            metric: 4096
    schematic: &rpiSchematic
      overlay:
        name: rpi_generic
        image: siderolabs/sbc-raspberrypi

  - hostname: kmgmt02.cin.macro.network
    ipAddress: 10.10.8.2
    controlPlane: true
    installDisk: *rpiMmcDevice
    nodeLabels:
      feature.node.kubernetes.io/network.max-link-speed: 1g
      topology.kubernetes.io/region: rack01
      topology.kubernetes.io/zone: az02
    networkInterfaces:
      - deviceSelector: *rpiNetDevice
        dhcp: false
        addresses:
          - "10.10.8.2/16"
          - "fc42:0:0:a::0802/64"
        mtu: *mtu
        routes: *routes
    schematic: *rpiSchematic

  - hostname: kmgmt03.cin.macro.network
    ipAddress: 10.10.8.3
    controlPlane: true
    installDisk: *rpiMmcDevice
    nodeLabels:
      feature.node.kubernetes.io/network.max-link-speed: 1g
      topology.kubernetes.io/region: rack01
      topology.kubernetes.io/zone: az03
    networkInterfaces:
      - deviceSelector: *rpiNetDevice
        dhcp: false
        addresses:
          - "10.10.8.3/16"
          - "fc42:0:0:a::0803/64"
        mtu: *mtu
        routes: *routes
    schematic: *rpiSchematic

  - hostname: kmgmt04.cin.macro.network
    ipAddress: 10.10.8.4
    installDisk: &rk1device /dev/mmcblk0
    nodeLabels:
      feature.node.kubernetes.io/network.max-link-speed: 1g
      topology.kubernetes.io/region: rack01
      topology.kubernetes.io/zone: az01
      bgp.kube.macro.network/peer-group: main
    networkInterfaces:
      - deviceSelector: &rk1NetDevice
          driver: rk_gmac-dwmac
          busPath: "fe1c0000.ethernet"
        dhcp: false
        addresses:
          - "10.10.8.4/16"
          - "fc42:0:0:a::0804/64"
        mtu: *mtu
        routes: *routes
    schematic: &rk1schematic
      overlay:
        name: turingrk1
        image: siderolabs/sbc-rockchip
      customization:
        extraKernelArgs:
          - cpufreq.default_governor=ondemand

  - hostname: kmgmt05.cin.macro.network
    ipAddress: 10.10.8.5
    installDisk: *rk1device
    nodeLabels:
      feature.node.kubernetes.io/network.max-link-speed: 1g
      topology.kubernetes.io/region: rack01
      topology.kubernetes.io/zone: az02
      bgp.kube.macro.network/peer-group: main
    networkInterfaces:
      - deviceSelector: *rk1NetDevice
        dhcp: false
        addresses:
          - "10.10.8.5/16"
          - "fc42:0:0:a::0805/64"
        mtu: *mtu
        routes: *routes
    schematic: *rk1schematic

  - hostname: kmgmt06.cin.macro.network
    ipAddress: 10.10.8.6
    installDisk: *rk1device
    nodeLabels:
      feature.node.kubernetes.io/network.max-link-speed: 1g
      topology.kubernetes.io/region: rack01
      topology.kubernetes.io/zone: az03
      bgp.kube.macro.network/peer-group: main
    networkInterfaces:
      - deviceSelector: *rk1NetDevice
        dhcp: false
        addresses:
          - "10.10.8.6/16"
          - "fc42:0:0:a::0806/64"
        mtu: *mtu
        routes: *routes
    schematic: *rk1schematic

controlPlane:
  nameservers: &nameservers
    - "10.10.0.1"
    - "fc42:0:0:a::"
  disableSearchDomain: &disableSearchDomain true
  schematic:
    customization:
      extraKernelArgs: &extraKernelArgs
        - "talos.logging.kernel=udp://syslog.cin.macro.network:6050/"
  machineFiles:
    - &spegelCriConfig
      path: /etc/cri/conf.d/20-customization.part
      op: create
      content: |
        [plugins."io.containerd.cri.v1.images"]
          discard_unpacked_layers = false
  patches:
    - "@../base/cluster.common.yaml"
    - "@../base/cluster.metal.yaml"

worker:
  nameservers: *nameservers
  disableSearchDomain: *disableSearchDomain
  schematic:
    customization:
      extraKernelArgs: *extraKernelArgs
  machineFiles:
    - *spegelCriConfig

patches:
  - "@../base/machine.common.yaml"
  - "@../base/machine.metal.yaml"
  - "@./machine.yaml"
